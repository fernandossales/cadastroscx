<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadastro">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.json">
<title>Cadastro de Campo</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#1b2220;--mute:#65706c;--line:#dce0db;--acc:#0d5c63;--acc-ink:#fff;--soft:#e2eeed;--warn:#8f4500;--danger:#b3261e;--ok:#1b6b3a;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#111514;--card:#1a201f;--ink:#e6ebe9;--mute:#96a19e;--line:#2b3432;--acc:#53b6b2;--acc-ink:#05292b;--soft:#1d3332;--warn:#f0a35c;--danger:#ff8a80;--ok:#7bd49a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--acc);color:var(--acc-ink);padding-top:env(safe-area-inset-top)}
.bar{display:flex;gap:6px;align-items:center;padding:8px 10px 8px 6px;min-height:52px}
.bar h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .st{font-size:12px;opacity:.85;white-space:nowrap}
.ib{background:transparent;border:0;color:inherit;font-size:26px;line-height:1;width:44px;height:44px;border-radius:10px}
.ib:active{background:rgba(255,255,255,.15)}
.prog{height:3px;background:rgba(255,255,255,.25)}.prog i{display:block;height:100%;background:var(--acc-ink);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;background:var(--bg);scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;min-height:36px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip small{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
main{padding:12px 14px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
h2{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:20px 4px 8px;font-weight:600}
.f{margin:0 0 16px}.f:last-child{margin-bottom:0}
.f>label,.f>.lb{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px}
textarea.in{min-height:100px;resize:vertical}
.f.cnt{display:flex;align-items:center;gap:10px;margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
.f.cnt:last-child{border-bottom:0}
.f.cnt>label{flex:1;margin:0;font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step .btn{width:40px;min-height:40px;padding:0;font-size:20px;line-height:1}
.step .in{width:52px;min-height:40px;text-align:center;padding:6px;font-variant-numeric:tabular-nums}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14.5px;text-align:left;min-height:42px}
.opt.on{background:var(--soft);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.on::before{content:"✓ ";color:var(--acc);font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;min-height:46px;font-weight:500}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.dan{color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:9px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13.5px}
.lst{display:flex;gap:12px;align-items:center}
.lst .t{font-weight:600}.lst .s{font-size:13px;color:var(--mute);margin-top:2px}
.pbar{height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.aviso{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;margin:0 0 12px}
.esc{font-size:13px;color:var(--warn);margin:2px 4px 10px}
/* GPS */
.gps{display:grid;gap:10px;border:1px dashed var(--acc);background:var(--soft);border-radius:12px;padding:14px;text-align:left;width:100%}
.gps .ll{font:600 17px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.gps .lugar{font-weight:600}
.gps .ac{display:flex;gap:8px;flex-wrap:wrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
/* fotos */
.addf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}
.fotos{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.fotos{grid-template-columns:1fr 1fr}}
.foto{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.foto .im{position:relative;aspect-ratio:4/3;background:#000}
.foto img{display:block;width:100%;height:100%;object-fit:cover}
.foto .stamp{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font:600 11.5px/1.35 -apple-system,system-ui,sans-serif;padding:6px 8px;white-space:pre-line}
.foto .b{padding:10px;display:grid;gap:8px}
.foto .geo{font-size:12.5px;color:var(--mute)}
.foto .geo.pend{color:var(--warn)}
/* rodapé */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.foot .btn{flex:1;max-width:240px}
/* folha (dialog) */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet .ac{display:grid;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <button class="ib hidden" id="bVoltar" aria-label="Voltar">‹</button>
    <h1 id="hTitulo">Cadastros de campo</h1>
    <span class="st" id="hStatus"></span>
    <button class="ib" id="bMenu" aria-label="Menu">⋯</button>
  </div>
  <div class="prog hidden" id="prog"><i></i></div>
  <nav class="tabs hidden" id="tabs" aria-label="Abas do laudo"></nav>
</div>
<main id="main"></main>
<div class="foot" id="foot"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fAlb" accept="image/*" multiple class="hidden">
<input type="file" id="fSelf" accept="image/*" capture="user" class="hidden">
<input type="file" id="fImp" accept=".json,application/json" class="hidden">
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="schema.js"></script>
<script src="geo.js"></script>
<script src="app.js"></script>
</body>
</html>
